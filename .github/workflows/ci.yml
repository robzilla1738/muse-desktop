name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run package:unsigned
      - name: Verify setup without an installed CLI
        run: npx playwright test tests/e2e/setup.spec.ts
      - name: Preserve executable permissions in the app archive
        run: |
          for app in release/mac*/Muse\ Desktop.app; do
            architecture=$(basename "$(dirname "$app")")
            ditto -c -k --sequesterRsrc --keepParent "$app" "release/unsigned-$architecture.zip"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-macos-app
          path: release/unsigned-*.zip
          retention-days: 7
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: unsigned-linux-app
            files: |
              release/Muse-Desktop-*-linux-*.AppImage
              release/Muse-Desktop-*-linux-*.tar.gz
          - os: windows-latest
            script: dist:win
            artifact: unsigned-windows-app
            files: |
              release/Muse-Desktop-*-win-*.exe
              release/Muse-Desktop-*-win-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 7
